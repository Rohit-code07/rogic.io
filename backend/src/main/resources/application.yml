spring:
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
  metrics:
    tags:
      application: nemologic

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

app:
  daily-puzzle:
    cron: "0 0 0 * * ?"
  daily-cleanup:
    cron: "0 0 0 * * ?"
