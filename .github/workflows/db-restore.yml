name: Database Disaster Recovery (Restore)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to restore'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      backup_file:
        description: 'Specific backup file name in S3 (e.g., db-backup-20260703-120000.sql.gz). Leave blank to restore the latest backup.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: "ap-northeast-2"
  AWS_REGION: "ap-northeast-2"

jobs:
  db-restore:
    name: Execute DB Restoration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event.inputs.environment == 'production' && 'arn:aws:iam::811162362403:role/nemologic-production-github-role' || 'arn:aws:iam::811162362403:role/nemologic-staging-github-role' }}
          aws-region: ap-northeast-2

      - name: Get Target EC2 Instance ID
        id: get-instance
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          TAG_VALUE="nemologic-${ENV_NAME}-server"
          if [ "$ENV_NAME" = "production" ]; then
            TAG_VALUE="nemologic-server"
          fi
          
          echo "Resolving instance ID for Name tag: $TAG_VALUE"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$TAG_VALUE" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::Running EC2 instance not found for tag $TAG_VALUE. If the instance was terminated, you must run Terraform Apply and App Deploy first to recreate it and its SSM agent."
            exit 1
          fi
          echo "Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Trigger DB Restore via AWS SSM SendCommand
        id: send-command
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          BACKUP_FILE="${{ github.event.inputs.backup_file }}"
          
          # Construct command string
          COMMAND="sudo FORCE_RESTORE=true /opt/nemologic/backups/restore_db.sh"
          if [ -n "$BACKUP_FILE" ]; then
            COMMAND="$COMMAND $BACKUP_FILE"
          fi
          
          echo "Sending command to instance $INSTANCE_ID: $COMMAND"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$COMMAND]" \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Monitor Command Execution (RTO Measurement)
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          
          echo "Monitoring restoration progress..."
          START_TIME=$(date +%s)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Current Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              END_TIME=$(date +%s)
              ELAPSED=$((END_TIME - START_TIME))
              echo "::notice::Database restore completed successfully!"
              echo "Realized RTO: $ELAPSED seconds"
              
              # Print stdout
              echo "=== Command Execution stdout ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Command execution failed with status $STATUS"
              
              # Print stderr
              echo "=== Command Execution stderr ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 5
          done
